name: PR Title

# Squash-merge uses the PR title as the commit subject. semantic-release only
# cuts a release when that subject is a Conventional Commit, so a non-conventional
# PR title silently skips publishing. This check enforces the convention up front.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title is a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # type(optional-scope)(optional !): description
          PATTERN='^(feat|fix|docs|refactor|perf|build|ci|chore|test|style)(\([a-z0-9-]+\))?!?: .+'
          if echo "$PR_TITLE" | grep -Eq "$PATTERN"; then
            echo "✅ PR title OK: $PR_TITLE"
          else
            echo "::error::PR title must be a Conventional Commit (e.g. 'fix(plugin): align manifest version'). Got: \"$PR_TITLE\""
            echo "Allowed types: feat fix docs refactor perf build ci chore test style. Add '!' for breaking changes."
            exit 1
          fi

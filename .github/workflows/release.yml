name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Upgrade npm to latest (OIDC requires npm >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - name: Run semantic-release (compute version, changelog, tag, GitHub release)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm via Trusted Publishing (OIDC)
        if: success()
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" = "0.0.0-development" ]; then
            echo "No release produced by semantic-release. Skipping publish."
            exit 0
          fi
          echo "Publishing @pavp/storywright@$VERSION"
          npm publish --provenance --access public

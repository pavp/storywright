name: Release

# Push to main → semantic-release computes the next version from Conventional
# Commits, tags + creates a GitHub Release + updates CHANGELOG.md.

on:
  push:
    branches: [main]

# Serialize releases — two quick pushes to main must not race on tag creation.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      released: ${{ steps.release.outputs.released }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          # PAT (not GITHUB_TOKEN) so the release commit/tag push bypasses the
          # main branch ruleset. GITHUB_TOKEN cannot be a bypass actor on a
          # personal repo, and pushes from it as the bot trip GH006.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install deps
        run: npm ci --no-audit --no-fund

      # Pre-release gates: a broken skill must never ship.
      - name: Validate skills
        run: npm run validate

      - name: Test
        run: npm test

      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          BEFORE=$(node -p "require('./package.json').version")
          npx semantic-release
          AFTER=$(node -p "require('./package.json').version")
          # @semantic-release/npm bumps package.json in-place; a changed version
          # means a release was cut. Robust to semantic-release log-format changes.
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "version=$AFTER" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
